<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCNA確認テスト</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f0f2f5;
  color: #1a1a2e;
  min-height: 100vh;
}

/* ── HEADER ── */
header {
  background: #1a1a2e;
  color: #fff;
  padding: 14px 20px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.3);
}
header h1 { font-size: 1.05rem; font-weight: 700; }
.header-meta { font-size: 0.8rem; color: #aab; margin-top: 2px; }

/* ── PROGRESS BAR ── */
#progress-wrap {
  height: 4px;
  background: #2a2a4a;
}
#progress-bar {
  height: 100%;
  background: #4caf50;
  transition: width .3s;
}

/* ── LAYOUT ── */
.container {
  max-width: 780px;
  margin: 0 auto;
  padding: 20px 16px 60px;
}

/* ── SCREENS ── */
#screen-loading, #screen-error {
  text-align: center;
  padding: 60px 20px;
  color: #666;
  font-size: 1rem;
}
#screen-error { color: #c0392b; }

/* ── QUIZ CARD ── */
.quiz-card {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  padding: 24px 20px;
}

.q-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  flex-wrap: wrap;
  gap: 6px;
}
.q-pos {
  font-size: 0.85rem;
  color: #666;
  font-weight: 600;
}
.q-badge {
  font-size: 0.75rem;
  padding: 3px 10px;
  border-radius: 99px;
  font-weight: 600;
}
.badge-single   { background: #e3f2fd; color: #1565c0; }
.badge-multiple { background: #fce4ec; color: #880e4f; }
.badge-pdf      { background: #f3e5f5; color: #6a1b9a; }

.q-text {
  font-size: 1rem;
  line-height: 1.7;
  margin-bottom: 20px;
  white-space: pre-wrap;
  word-break: break-word;
}

/* ── CHOICES ── */
.choice-list { display: flex; flex-direction: column; gap: 10px; }

.choice-label {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #f8f9fc;
  border: 2px solid #e0e3ef;
  border-radius: 8px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
  font-size: 0.93rem;
  line-height: 1.55;
}
.choice-label:hover { border-color: #7986cb; background: #f0f2ff; }
.choice-label input { flex-shrink: 0; margin-top: 3px; accent-color: #3f51b5; }
.choice-key { font-weight: 700; color: #3f51b5; flex-shrink: 0; }

/* ── RESULT STATES ── */
.choice-label.correct-selected { background: #e8f5e9; border-color: #4caf50; }
.choice-label.wrong-selected   { background: #ffebee; border-color: #f44336; }
.choice-label.correct-miss     { background: #fff9c4; border-color: #fbc02d; }

/* ── RESULT BANNER ── */
.result-banner {
  display: none;
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 0.95rem;
}
.banner-correct { background: #e8f5e9; color: #2e7d32; border: 1.5px solid #4caf50; }
.banner-wrong   { background: #ffebee; color: #b71c1c; border: 1.5px solid #f44336; }
.banner-unans   { background: #fffde7; color: #f57f17; border: 1.5px solid #fbc02d; }

/* ── EXPLANATION ── */
.exp-box {
  display: none;
  margin-top: 14px;
  background: #f5f5f5;
  border-left: 4px solid #9e9e9e;
  border-radius: 0 8px 8px 0;
  padding: 12px 14px;
  font-size: 0.88rem;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  color: #444;
}
.exp-title { font-weight: 700; color: #333; margin-bottom: 6px; }

/* ── NAVIGATION ── */
.nav-buttons {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 22px;
  gap: 10px;
  flex-wrap: wrap;
}

/* ── BUTTONS ── */
button {
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s, transform .1s;
}
button:active { transform: scale(.97); }
button:disabled { opacity: .4; cursor: not-allowed; }

.btn-primary  { background: #3f51b5; color: #fff; }
.btn-outline  { background: #fff; color: #3f51b5; border: 2px solid #3f51b5; }
.btn-success  { background: #4caf50; color: #fff; }
.btn-danger   { background: #f44336; color: #fff; }
.btn-gray     { background: #9e9e9e; color: #fff; }
.btn-download { background: #00897b; color: #fff; }

/* ── SCORING TOOLBAR ── */
#toolbar {
  background: #fff;
  border-top: 2px solid #e0e3ef;
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  padding: 10px 16px;
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
  box-shadow: 0 -2px 10px rgba(0,0,0,.08);
  z-index: 99;
}
#toolbar .answered-info {
  font-size: 0.82rem;
  color: #666;
  align-self: center;
  white-space: nowrap;
}

/* ── RESULT SCREEN ── */
.result-section {
  background: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
  padding: 24px 20px;
  margin-bottom: 20px;
}
.result-section h2 {
  font-size: 1.1rem;
  margin-bottom: 16px;
  color: #1a1a2e;
  border-bottom: 2px solid #e0e3ef;
  padding-bottom: 8px;
}

.score-display {
  text-align: center;
  padding: 20px 0 10px;
}
.score-number {
  font-size: 3rem;
  font-weight: 800;
  color: #3f51b5;
  line-height: 1;
}
.score-label { font-size: 0.9rem; color: #777; margin-top: 4px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
  gap: 12px;
  margin-top: 20px;
}
.stat-box {
  background: #f5f7ff;
  border-radius: 8px;
  padding: 14px 8px;
  text-align: center;
}
.stat-val  { font-size: 1.6rem; font-weight: 700; }
.stat-lbl  { font-size: 0.75rem; color: #666; margin-top: 2px; }
.val-correct   { color: #2e7d32; }
.val-wrong     { color: #c62828; }
.val-unanswered{ color: #f57f17; }
.val-rate      { color: #1565c0; }

/* ── RESULT DETAIL ── */
.result-item {
  border: 1.5px solid #e0e3ef;
  border-radius: 8px;
  margin-bottom: 14px;
  overflow: hidden;
}
.result-item-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: #f8f9fc;
  flex-wrap: wrap;
  cursor: pointer;
  user-select: none;
}
.result-item-header:hover { background: #f0f2ff; }
.verdict-badge {
  font-size: 0.75rem;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: 99px;
  flex-shrink: 0;
}
.v-correct   { background: #e8f5e9; color: #2e7d32; }
.v-wrong     { background: #ffebee; color: #b71c1c; }
.v-unanswered{ background: #fffde7; color: #f57f17; }
.result-item-body {
  padding: 14px;
  display: none;
  border-top: 1px solid #e0e3ef;
}
.result-item-body.open { display: block; }
.ri-qtext { font-size: 0.9rem; line-height: 1.65; margin-bottom: 10px; white-space: pre-wrap; }
.ri-row { font-size: 0.85rem; margin-bottom: 6px; }
.ri-row strong { color: #444; }
.ri-exp { font-size: 0.82rem; line-height: 1.6; color: #555; margin-top: 8px;
  background: #f5f5f5; padding: 8px 10px; border-radius: 6px; white-space: pre-wrap; }

/* ── NOS LIST ── */
.nos-list { font-size: 0.85rem; line-height: 1.8; word-break: break-all; color: #555; }

/* ── DOWNLOAD BUTTONS ── */
.download-group {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 8px;
}

/* ── RESPONSIVE ── */
@media (max-width: 480px) {
  .quiz-card { padding: 16px 14px; }
  .q-text  { font-size: 0.93rem; }
  .choice-label { font-size: 0.87rem; }
  .score-number { font-size: 2.4rem; }
  #toolbar { padding: 8px 12px; }
  button { padding: 9px 14px; font-size: 0.83rem; }
}
</style>
</head>
<body>

<header>
  <h1 id="header-title">CCNA確認テスト</h1>
  <div class="header-meta" id="header-meta"></div>
</header>
<div id="progress-wrap"><div id="progress-bar" style="width:0%"></div></div>

<div class="container">
  <div id="screen-loading">テストデータを読み込んでいます...</div>
  <div id="screen-error"  style="display:none"></div>

  <!-- ======== QUIZ SCREEN ======== -->
  <div id="screen-quiz" style="display:none">
    <div class="quiz-card">
      <div class="q-meta">
        <span class="q-pos" id="q-pos">1 / 100</span>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="q-badge badge-pdf"    id="q-pdf-no">PDF Q?</span>
          <span class="q-badge badge-single" id="q-type-badge">単一選択</span>
        </div>
      </div>
      <div class="q-text" id="q-text"></div>
      <div class="choice-list" id="choice-list"></div>
      <div class="result-banner" id="result-banner"></div>
      <div class="exp-box" id="exp-box">
        <div class="exp-title">解説</div>
        <div id="exp-text"></div>
      </div>
      <div class="nav-buttons">
        <button class="btn-outline" id="btn-prev" onclick="navigate(-1)">← 前へ</button>
        <button class="btn-primary" id="btn-submit" onclick="submitCurrent()">回答する</button>
        <button class="btn-outline" id="btn-next" onclick="navigate(1)">次へ →</button>
      </div>
    </div>
  </div>

  <!-- ======== RESULT SCREEN ======== -->
  <div id="screen-result" style="display:none">

    <div class="result-section">
      <h2>採点結果</h2>
      <div class="score-display">
        <div class="score-number" id="score-number">0</div>
        <div class="score-label">/ <span id="score-total">100</span> 点</div>
      </div>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-val val-correct"   id="rs-correct">0</div><div class="stat-lbl">正解</div></div>
        <div class="stat-box"><div class="stat-val val-wrong"     id="rs-wrong">0</div><div class="stat-lbl">不正解</div></div>
        <div class="stat-box"><div class="stat-val val-unanswered" id="rs-unans">0</div><div class="stat-lbl">未回答</div></div>
        <div class="stat-box"><div class="stat-val val-rate"      id="rs-rate">-</div><div class="stat-lbl">正答率</div></div>
      </div>
    </div>

    <div class="result-section">
      <h2>出題PDF問題番号</h2>
      <div class="nos-list" id="nos-list"></div>
    </div>

    <div class="result-section">
      <h2>ダウンロード</h2>
      <div class="download-group">
        <button class="btn-download" onclick="downloadCSV()">CSVダウンロード</button>
        <button class="btn-gray"     onclick="downloadAnswerJSON()">回答JSONダウンロード</button>
      </div>
    </div>

    <div class="result-section">
      <h2>各問題の結果
        <span style="font-size:0.8rem;font-weight:400;color:#888;margin-left:8px">（クリックで詳細展開）</span>
      </h2>
      <div id="result-detail-list"></div>
    </div>

    <div style="text-align:center;margin-top:16px">
      <button class="btn-outline" onclick="backToQuiz()">← テストに戻る</button>
    </div>
  </div>
</div>

<!-- FIXED BOTTOM TOOLBAR (quiz screen only) -->
<div id="toolbar" style="display:none">
  <span class="answered-info" id="toolbar-info">0 / 100 回答済み</span>
  <button class="btn-success" onclick="scoreTest()">採点する</button>
</div>

<script>
// ================================================================
// STATE
// ================================================================

let testData   = null;   // loaded JSON
let answers    = {};     // {testQuestionNo_str: [list]}
let currentIdx = 0;      // 0-based index into testData.questions
let graded     = false;
let gradeResults = [];
let takenAt    = null;

const params = new URLSearchParams(window.location.search);
const TEST_JSON_PATH = params.get('test') || 'generated/ccna_test_001.json';

// ================================================================
// INIT
// ================================================================

async function init() {
  try {
    const res = await fetch(TEST_JSON_PATH);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    testData = await res.json();
  } catch (e) {
    showError(
      `テストデータの読み込みに失敗しました。<br>` +
      `<code style="font-size:0.85em;background:#f5f5f5;padding:2px 6px;border-radius:4px">${TEST_JSON_PATH}</code><br>` +
      `<small style="color:#999">ファイルが存在するか、パスが正しいか確認してください。</small><br>` +
      `<small style="color:#bbb">${e.message}</small>`
    );
    return;
  }

  // Load saved answers from localStorage
  const saved = localStorage.getItem(storageKey());
  if (saved) {
    try { answers = JSON.parse(saved); } catch { answers = {}; }
  }

  if (!takenAt) {
    takenAt = localStorage.getItem(storageKey('takenAt')) || new Date().toISOString();
    localStorage.setItem(storageKey('takenAt'), takenAt);
  }

  document.getElementById('header-title').textContent = testData.title;
  document.getElementById('header-meta').textContent  =
    `${testData.totalQuestions}問 ／ PDF範囲: Q${testData.sourceRange.from}〜Q${testData.sourceRange.to} ／ ${TEST_JSON_PATH}`;

  showQuizScreen();
  renderQuestion();
}

function storageKey(suffix) {
  const base = `ccnaTest_${testData ? testData.testId : 'unknown'}_answers`;
  return suffix ? `ccnaTest_${testData.testId}_${suffix}` : base;
}

// ================================================================
// SCREEN CONTROL
// ================================================================

function showError(msg) {
  document.getElementById('screen-loading').style.display = 'none';
  const el = document.getElementById('screen-error');
  el.innerHTML = msg;
  el.style.display = 'block';
}

function showQuizScreen() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-quiz').style.display    = 'block';
  document.getElementById('toolbar').style.display        = 'flex';
  document.getElementById('screen-result').style.display  = 'none';
}

function showResultScreen() {
  document.getElementById('screen-quiz').style.display   = 'none';
  document.getElementById('toolbar').style.display       = 'none';
  document.getElementById('screen-result').style.display = 'block';
  window.scrollTo(0, 0);
}

function backToQuiz() {
  graded = false;
  showQuizScreen();
  renderQuestion();
}

// ================================================================
// RENDER QUESTION
// ================================================================

function renderQuestion() {
  const q = testData.questions[currentIdx];
  const total = testData.questions.length;

  // Progress
  const progressPct = ((currentIdx + 1) / total) * 100;
  document.getElementById('progress-bar').style.width = progressPct + '%';

  // Meta
  document.getElementById('q-pos').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('q-pdf-no').textContent = `PDF Q${q.sourceQuestionNo}`;

  const typeBadge = document.getElementById('q-type-badge');
  if (q.type === 'multiple') {
    typeBadge.textContent = `複数選択 (${q.answer.length}つ)`;
    typeBadge.className   = 'q-badge badge-multiple';
  } else {
    typeBadge.textContent = '単一選択';
    typeBadge.className   = 'q-badge badge-single';
  }

  document.getElementById('q-text').textContent = q.question;

  // Choices
  const list = document.getElementById('choice-list');
  list.innerHTML = '';
  const choiceEntries = Object.entries(q.choices);
  const savedAns = answers[String(q.testQuestionNo)] || [];

  choiceEntries.forEach(([key, text]) => {
    const label = document.createElement('label');
    label.className = 'choice-label';
    label.dataset.key = key;

    const input = document.createElement('input');
    input.type  = q.type === 'multiple' ? 'checkbox' : 'radio';
    input.name  = 'choice';
    input.value = key;
    if (savedAns.includes(key)) input.checked = true;

    input.addEventListener('change', () => saveCurrentAnswer());

    const keySpan = document.createElement('span');
    keySpan.className   = 'choice-key';
    keySpan.textContent = key + '.';

    const textSpan = document.createElement('span');
    textSpan.textContent = text;

    label.appendChild(input);
    label.appendChild(keySpan);
    label.appendChild(textSpan);
    list.appendChild(label);
  });

  // If already graded, show result state for this question
  if (graded) {
    applyGradedState(q);
  } else {
    document.getElementById('result-banner').style.display = 'none';
    document.getElementById('exp-box').style.display       = 'none';
  }

  // Nav buttons
  document.getElementById('btn-prev').disabled = (currentIdx === 0);
  document.getElementById('btn-next').disabled = (currentIdx === total - 1);

  // Submit button: hide if already graded
  document.getElementById('btn-submit').style.display = graded ? 'none' : 'inline-block';

  updateToolbarInfo();
}

function applyGradedState(q) {
  const saved   = answers[String(q.testQuestionNo)] || [];
  const correct = q.answer;

  const labels = [...document.querySelectorAll('.choice-label')];
  labels.forEach(label => {
    const key = label.dataset.key;
    const isSelected = saved.includes(key);
    const isCorrect  = correct.includes(key);

    if (isSelected && isCorrect)  label.classList.add('correct-selected');
    else if (isSelected && !isCorrect) label.classList.add('wrong-selected');
    else if (!isSelected && isCorrect) label.classList.add('correct-miss');
  });

  // Disable all inputs
  document.querySelectorAll('#choice-list input').forEach(i => i.disabled = true);

  // Banner
  const banner = document.getElementById('result-banner');
  if (saved.length === 0) {
    banner.textContent  = '未回答';
    banner.className    = 'result-banner banner-unans';
  } else if (isCorrectAnswer(q, saved)) {
    banner.textContent  = '正解';
    banner.className    = 'result-banner banner-correct';
  } else {
    banner.textContent  = `不正解 ／ 正解: ${correct.join(', ')}`;
    banner.className    = 'result-banner banner-wrong';
  }
  banner.style.display = 'block';

  // Explanation
  if (q.explanation) {
    document.getElementById('exp-text').textContent = q.explanation;
    document.getElementById('exp-box').style.display = 'block';
  }
}

// ================================================================
// ANSWER SAVE
// ================================================================

function saveCurrentAnswer() {
  const q       = testData.questions[currentIdx];
  const inputs  = document.querySelectorAll('#choice-list input');
  const selected = [...inputs].filter(i => i.checked).map(i => i.value);
  answers[String(q.testQuestionNo)] = selected;
  localStorage.setItem(storageKey(), JSON.stringify(answers));
  updateToolbarInfo();
}

function submitCurrent() {
  saveCurrentAnswer();
  // Show explanation without full grading
  const q = testData.questions[currentIdx];
  const saved = answers[String(q.testQuestionNo)] || [];

  const labels = [...document.querySelectorAll('.choice-label')];
  labels.forEach(label => {
    const key = label.dataset.key;
    const isSelected = saved.includes(key);
    const isCorrect  = q.answer.includes(key);
    if (isSelected && isCorrect)  label.classList.add('correct-selected');
    else if (isSelected && !isCorrect) label.classList.add('wrong-selected');
    else if (!isSelected && isCorrect) label.classList.add('correct-miss');
  });
  document.querySelectorAll('#choice-list input').forEach(i => i.disabled = true);

  const banner = document.getElementById('result-banner');
  if (saved.length === 0) {
    banner.textContent = '未回答';
    banner.className   = 'result-banner banner-unans';
  } else if (isCorrectAnswer(q, saved)) {
    banner.textContent = '正解';
    banner.className   = 'result-banner banner-correct';
  } else {
    banner.textContent = `不正解 ／ 正解: ${q.answer.join(', ')}`;
    banner.className   = 'result-banner banner-wrong';
  }
  banner.style.display = 'block';

  if (q.explanation) {
    document.getElementById('exp-text').textContent = q.explanation;
    document.getElementById('exp-box').style.display = 'block';
  }

  document.getElementById('btn-submit').style.display = 'none';
}

function updateToolbarInfo() {
  const total    = testData.questions.length;
  const answered = testData.questions.filter(q => {
    const a = answers[String(q.testQuestionNo)];
    return a && a.length > 0;
  }).length;
  document.getElementById('toolbar-info').textContent = `${answered} / ${total} 回答済み`;
}

// ================================================================
// NAVIGATION
// ================================================================

function navigate(delta) {
  saveCurrentAnswer();
  const next = currentIdx + delta;
  if (next < 0 || next >= testData.questions.length) return;
  currentIdx = next;
  renderQuestion();
  window.scrollTo(0, 0);
}

// ================================================================
// SCORING
// ================================================================

function isCorrectAnswer(q, userAns) {
  if (userAns.length === 0) return false;
  const cs = new Set(q.answer);
  const us = new Set(userAns);
  return cs.size === us.size && [...cs].every(a => us.has(a));
}

function scoreTest() {
  graded = true;
  takenAt = localStorage.getItem(storageKey('takenAt')) || new Date().toISOString();

  gradeResults = testData.questions.map(q => {
    const saved   = answers[String(q.testQuestionNo)] || [];
    let verdict, score;
    if (saved.length === 0) {
      verdict = '未回答'; score = 0;
    } else if (isCorrectAnswer(q, saved)) {
      verdict = '正解'; score = 1;
    } else {
      verdict = '不正解'; score = 0;
    }
    return { q, saved, verdict, score };
  });

  const total    = testData.totalQuestions;
  const correct  = gradeResults.filter(r => r.verdict === '正解').length;
  const wrong    = gradeResults.filter(r => r.verdict === '不正解').length;
  const unanswered = gradeResults.filter(r => r.verdict === '未回答').length;
  const rate     = total > 0 ? Math.round(correct / total * 100) : 0;

  document.getElementById('score-number').textContent = correct;
  document.getElementById('score-total').textContent  = total;
  document.getElementById('rs-correct').textContent   = correct;
  document.getElementById('rs-wrong').textContent     = wrong;
  document.getElementById('rs-unans').textContent     = unanswered;
  document.getElementById('rs-rate').textContent      = rate + '%';

  // Nos list
  const nos = testData.questions.map(q => `Q${q.sourceQuestionNo}`);
  document.getElementById('nos-list').textContent = nos.join('、 ');

  // Detail list
  renderDetailList();

  showResultScreen();
}

function renderDetailList() {
  const container = document.getElementById('result-detail-list');
  container.innerHTML = '';

  gradeResults.forEach((r, i) => {
    const item = document.createElement('div');
    item.className = 'result-item';

    // Header
    const header = document.createElement('div');
    header.className = 'result-item-header';

    const vcls = r.verdict === '正解' ? 'v-correct' : (r.verdict === '不正解' ? 'v-wrong' : 'v-unanswered');
    header.innerHTML =
      `<span class="verdict-badge ${vcls}">${r.verdict}</span>` +
      `<span style="font-size:0.85rem;color:#555">Q${i+1}</span>` +
      `<span class="q-badge badge-pdf" style="font-size:0.72rem;padding:2px 8px">PDF Q${r.q.sourceQuestionNo}</span>` +
      `<span style="font-size:0.85rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.q.question.slice(0,60)}${r.q.question.length>60?'…':''}</span>`;

    const body = document.createElement('div');
    body.className = 'result-item-body';

    const choicesHtml = Object.entries(r.q.choices).map(([k, v]) => {
      const isCorrect  = r.q.answer.includes(k);
      const isSelected = r.saved.includes(k);
      const mark = isCorrect && isSelected ? '✅' : (isCorrect ? '🟡' : (isSelected ? '❌' : '　'));
      return `<div style="font-size:0.83rem;margin-bottom:3px">${mark} <strong>${k}.</strong> ${v}</div>`;
    }).join('');

    body.innerHTML =
      `<div class="ri-qtext">${r.q.question}</div>` +
      choicesHtml +
      `<div class="ri-row" style="margin-top:8px"><strong>あなたの回答:</strong> ${r.saved.length ? r.saved.join(', ') : '（未回答）'}</div>` +
      `<div class="ri-row"><strong>正解:</strong> ${r.q.answer.join(', ')}</div>` +
      (r.q.explanation ? `<div class="ri-exp">${r.q.explanation}</div>` : '');

    header.addEventListener('click', () => body.classList.toggle('open'));
    item.appendChild(header);
    item.appendChild(body);
    container.appendChild(item);
  });
}

// ================================================================
// CSV DOWNLOAD
// ================================================================

function generateCSV() {
  const headers = [
    'テストID', 'テスト名', '受験日時',
    'テスト内問題番号', 'PDF問題番号', '問題タイプ',
    '問題文',
    '選択肢A', '選択肢B', '選択肢C', '選択肢D', '選択肢E', '選択肢F',
    'ユーザー回答', '正解', '正誤', '得点', '解説',
  ];

  const dateStr = takenAt ? takenAt.replace('T', ' ').slice(0, 19) : '';
  const TYPE_LABEL = { single: '単一選択', multiple: '複数選択' };

  const rows = [headers];
  gradeResults.forEach(r => {
    const c = r.q.choices;
    rows.push([
      testData.testId,
      testData.title,
      dateStr,
      r.q.testQuestionNo,
      r.q.sourceQuestionNo,
      TYPE_LABEL[r.q.type] || r.q.type,
      r.q.question,
      c.A || '', c.B || '', c.C || '', c.D || '', c.E || '', c.F || '',
      r.saved.join(', '),
      r.q.answer.join(', '),
      r.verdict,
      r.score,
      r.q.explanation || '',
    ]);
  });

  return rows.map(row =>
    row.map(cell => {
      const s = String(cell ?? '');
      if (s.includes(',') || s.includes('"') || s.includes('\n') || s.includes('\r')) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')
  ).join('\r\n');
}

function downloadCSV() {
  const csv  = '﻿' + generateCSV();  // BOM for Excel
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = (takenAt || new Date().toISOString()).slice(0, 10).replace(/-/g, '');
  a.href     = url;
  a.download = `${testData.testId}_result_${date}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function downloadAnswerJSON() {
  const data = {
    testId:  testData.testId,
    title:   testData.title,
    takenAt: takenAt || new Date().toISOString(),
    answers: answers,
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = (takenAt || new Date().toISOString()).slice(0, 10).replace(/-/g, '');
  a.href     = url;
  a.download = `answers_${testData.testId}_${date}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
